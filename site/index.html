<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f2f4f3">
    <title>DResearch Planner</title>
    <link rel="icon" type="image/svg+xml" href="planner-icon.svg">
    <link rel="apple-touch-icon" href="planner-icon.png">
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <main class="planner-web dresearch-root" data-dr-theme="light">
      <header class="planner-web-header">
        <div class="planner-web-brand-group">
          <img class="planner-web-brand-icon" src="planner-icon.svg" alt="" width="28" height="28">
          <strong class="planner-web-brand">DResearch Planner</strong>
          <div id="planner-page-context" class="planner-web-page-context"></div>
        </div>
        <div class="planner-web-sync-summary">
          <button id="sync-now" class="planner-web-sync-button is-idle" type="button">
            <span class="planner-web-sync-indicator" aria-hidden="true"></span>
            <span id="sync-status" role="status">尚未同步</span>
            <span id="sync-action" class="planner-web-sync-action">同步</span>
          </button>
          <div id="planner-refresh-slot" class="planner-web-refresh-slot"></div>
          <button id="sync-settings-toggle" class="planner-web-settings-button" type="button" aria-label="同步设置" title="同步设置" aria-expanded="false" aria-controls="sync-settings">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M3 5h8m3 0h3M3 10h3m3 0h8M3 15h7m3 0h4"/>
              <circle cx="12.5" cy="5" r="1.5"/>
              <circle cx="7.5" cy="10" r="1.5"/>
              <circle cx="11.5" cy="15" r="1.5"/>
            </svg>
          </button>
        </div>
      </header>

      <section id="sync-settings" class="planner-web-sync-panel dr-card" aria-labelledby="sync-settings-title" hidden>
        <div class="planner-web-sync-panel-head">
          <div>
            <h2 id="sync-settings-title">同步设置</h2>
            <p>配置只保存在当前浏览器中。</p>
          </div>
          <button id="sync-settings-close" class="planner-web-close-button" type="button" aria-label="关闭同步设置">×</button>
        </div>
        <div class="planner-web-sync-detail">
          <span class="planner-web-sync-indicator" aria-hidden="true"></span>
          <span id="sync-status-detail">尚未同步</span>
        </div>
        <label>
          <span>GitHub Token</span>
          <input id="sync-token" class="dr-input" type="password" autocomplete="new-password" placeholder="输入 Token">
        </label>
        <label>
          <span>Secret Gist ID</span>
          <input id="sync-gist" class="dr-input" type="text" autocomplete="off" placeholder="输入 Gist ID">
        </label>
        <div class="planner-web-sync-actions">
          <button id="sync-create" class="dr-button" type="button">新建 Gist</button>
          <button id="sync-save" class="dr-primary-button" type="button">保存配置</button>
        </div>
      </section>

      <section id="planner" class="dr-page-panel is-active"></section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
